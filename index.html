<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Kitten</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Talk to Your AI Kitten</h1>
        <div id="kitten-container">
            <img id="kitten-image" src="kitten.png" alt="A cute AI kitten">
            <div id="status-indicator"></div>
        </div>
        <div id="controls">
            <button id="talk-button" class="contrast">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" x2="12" y1="19" y2="22"></line></svg>
                <span>Start Talking</span>
            </button>
        </div>
        <div id="transcript-container">
            <article id="transcript">
                <p><em>Your kitten is waiting to hear from you... Press the button to speak.</em></p>
            </article>
        </div>
        <details>
            <summary>View Memories</summary>
            <div id="memory-log">
                <p><em>No memories stored yet.</em></p>
            </div>
            <button id="delete-memories-button" class="secondary outline">Delete All Memories</button>
        </details>
    </main>
    <script type="importmap">
    {
      "imports": {
        "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.5/index.js",
        "lucide": "https://cdn.jsdelivr.net/npm/lucide@0.378.0/dist/esm/lucide.js"
      }
    }
    </script>
    <script type="module" src="script.js"></script>

</body>
</html>
